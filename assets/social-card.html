<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;
  background:radial-gradient(900px 600px at 0% 0%,#4c61a9 0%,transparent 60%),linear-gradient(135deg,#2a4499 0%,#1f3a93 55%,#152a6e 100%);position:relative}
.copy{position:absolute;left:96px;top:92px;width:640px}
.mark{display:flex;align-items:center;gap:20px;margin-bottom:34px}
.mark svg{width:84px;height:84px}
.mark span{font-size:30px;font-weight:600;opacity:.85;letter-spacing:.01em}
h1{font-size:84px;line-height:1;margin:0 0 22px;font-weight:800;letter-spacing:-.02em}
p{font-size:31px;line-height:1.3;margin:0 0 34px;color:#dfe5f7;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:12px;max-width:600px}
.chip{font-size:21px;font-weight:600;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.chip b{color:#f3c552}
.url{position:absolute;left:96px;bottom:90px;font-size:22px;color:#b9c4ea;font-weight:500}
/* live widget panel */
.a11yw-toggle{display:none!important}
.a11yw{position:absolute!important;right:92px!important;top:84px!important;bottom:auto!important;transform:scale(.94);transform-origin:top right}
.a11yw-panel{position:static!important;max-height:none!important;box-shadow:0 30px 70px rgba(5,15,50,.45),0 0 0 1px rgba(255,255,255,.1)!important}
</style></head><body>
<div class="copy">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10.5" stroke-width="1.6"/><circle cx="12" cy="6.6" r="1.6" fill="#fff" stroke="none"/><path d="M6.5 9.3 12 10.4l5.5-1.1M12 10.4v4.2M12 14.6 9.6 19M12 14.6l2.4 4.4" stroke-width="1.7"/></svg><span>Open source</span></div>
  <h1>a11y-widget</h1>
  <p>A drop-in accessibility panel for any website. One script, no dependencies, no tracking.</p>
  <div class="chips"><span class="chip">Text size</span><span class="chip">Contrast</span><span class="chip">Read aloud</span><span class="chip"><b>4</b> languages</span></div>
</div>
<div class="url">github.com/a11y-widget/a11y-widget</div>
<script src="../a11y-widget.js"></script>
<script>addEventListener('load',function(){A11yWidget.set({size:120});A11yWidget.open('text');document.documentElement.classList.remove('a11yw-text-2');});</script>
</body></html>
